name: 'SwaggerHub Portal Management'
description: 'Automate deployment, validation, and publishing of products and content to a SwaggerHub Portal instance.'
author: 'SmartBear DevRel <devrel@smartbear.com>'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  swaggerhub-api-key:
    description: 'SwaggerHub API Key with permissions to publish Portal content.'
    required: true
  swaggerhub-portal-subdomain:
    description: 'SwaggerHub Portal subdomain (e.g. mycompany for mycompany.portal.swaggerhub.com)'
    required: true
  swaggerhub-org-name:
    description: 'SwaggerHub organization name.'
    required: true
  log-level:
    description: 'Log level for script output (1=DEBUG, 2=INFO, 3=WARNING, 4=ERROR)'
    required: false
    default: '2'
  skip-spell-check:
    description: 'Skip the spell check step.'
    required: false
    default: 'false'
  skip-api-linting:
    description: 'Skip the API linting step.'
    required: false
    default: 'false'
  publish:
    description: 'Publish the content to SwaggerHub Portal.'
    required: false
    default: 'false'
  product-folder:
    description: 'Path to the products folder.'
    required: false
    default: 'products'
  custom-words-file:
    description: 'Path to the custom words file for spell checking.'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up jq
      uses: dcarbone/install-jq-action@v2.1.0

    - name: Set up file utility (macOS/Linux)
      shell: bash
      run: |
        set -e
        if ! command -v file >/dev/null; then
          sudo apt-get update && sudo apt-get install -y file
        fi

    - name: Set up environment variables
      shell: bash
      run: |
        set -e
        echo "SWAGGERHUB_API_KEY=${{ inputs.swaggerhub-api-key }}" >> $GITHUB_ENV
        echo "SWAGGERHUB_PORTAL_SUBDOMAIN=${{ inputs.swaggerhub-portal-subdomain }}" >> $GITHUB_ENV
        echo "SWAGGERHUB_ORG_NAME=${{ inputs.swaggerhub-org-name }}" >> $GITHUB_ENV
        echo "LOG_LEVEL=${{ inputs.log-level }}" >> $GITHUB_ENV
        echo "PRODUCTS_FOLDER=${{ github.workspace }}/${{ inputs.product-folder }}" >> $GITHUB_ENV
        if [ -z "${{ inputs.custom-words-file }}" ]; then
          echo "CUSTOM_WORDS_FILE=" >> $GITHUB_ENV
        else
          echo "CUSTOM_WORDS_FILE=${{ github.workspace }}/${{ inputs.custom-words-file }}" >> $GITHUB_ENV
        fi

    - name: validate inputs
      shell: bash
      run: |
        set -e
        if [ ! -d "$PRODUCTS_FOLDER" ]; then
          echo "Product folder not found: $PRODUCTS_FOLDER"
          exit 1
        fi
        if [ -n "$CUSTOM_WORDS_FILE" ] && [ ! -f "$CUSTOM_WORDS_FILE" ]; then
          echo "Custom words file not found: $CUSTOM_WORDS_FILE"
          exit 1
        fi

    - name: Run SwaggerHub Portal Management script
      shell: bash
      run: |
        set -e
        chmod +x $GITHUB_ACTION_PATH/run-portal-management.sh
        $GITHUB_ACTION_PATH/run-portal-management.sh \
          --api-key "$SWAGGERHUB_API_KEY" \
          --portal-subdomain "$SWAGGERHUB_PORTAL_SUBDOMAIN" \
          --org-name "$SWAGGERHUB_ORG_NAME" \
          --log-level "$LOG_LEVEL" \
          ${{ inputs.skip-spell-check == 'true' && '--skip-spell-check' || '' }} \
          ${{ inputs.skip-api-linting == 'true' && '--skip-api-linting' || '' }} \
          ${{ inputs.publish == 'true' && '--publish' || '' }} \
          --product-folder "$PRODUCTS_FOLDER" \
          ${{ inputs.custom-words-file && format('--custom-words-file "{0}"', env.CUSTOM_WORDS_FILE) || '' }}
      env:
        SWAGGERHUB_API_KEY: ${{ env.SWAGGERHUB_API_KEY }}
        SWAGGERHUB_PORTAL_SUBDOMAIN: ${{ env.SWAGGERHUB_PORTAL_SUBDOMAIN }}
        SWAGGERHUB_ORG_NAME: ${{ env.SWAGGERHUB_ORG_NAME }}
        LOG_LEVEL: ${{ env.LOG_LEVEL }}
        PRODUCTS_FOLDER: ${{ env.PRODUCTS_FOLDER }}
        CUSTOM_WORDS_FILE: ${{ env.CUSTOM_WORDS_FILE }}
